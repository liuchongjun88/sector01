<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECTOR 01 | Ultra-Thin Audio & Ambient Light</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d0d0d; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Hero Section */
        .hero { position: relative; text-align: center; padding: 60px 0 20px; }
        .hero-img { width: 100%; max-width: 1100px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        
        /* Features/Exploded Section */
        .section { padding: 80px 0; text-align: center; }
        .section-img { width: 100%; max-width: 1000px; border-radius: 12px; margin-top: 30px; }
        
        /* CTA Section */
        .cta-box { background: linear-gradient(145deg, #1a1a1a, #111111); border: 1px solid #2a2a2a; border-radius: 16px; padding: 50px 20px; margin: 60px 0; text-align: center; }
        .cta-title { font-size: 2.2rem; margin-bottom: 15px; color: #fff; }
        .cta-title span { color: #f39c12; }
        .cta-sub { color: #a0a0a0; font-size: 1.1rem; margin-bottom: 30px; }
        
        /* Form */
        .email-form { display: flex; justify-content: center; gap: 10px; max-width: 500px; margin: 0 auto; flex-wrap: wrap; }
        .email-input { padding: 15px 20px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 1rem; flex: 1; min-width: 260px; }
        .email-input:focus { outline: none; border-color: #f39c12; }
        .submit-btn { padding: 15px 30px; border-radius: 8px; border: none; background: #f39c12; color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #e67e22; box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); }
        
        footer { text-align: center; padding: 40px 0; color: #555; font-size: 0.9rem; border-top: 1px solid #1a1a1a; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Section 1: Hero -->
        <header class="hero">
            <img src="图1.png" alt="SECTOR 01 Hero" class="hero-img">
        </header>

        <!-- Section 2: Lifestyle / Mood -->
        <section class="section">
            <img src="图3.png" alt="SECTOR 01 Lifestyle" class="section-img">
        </section>

        <!-- Section 3: Engineering / Exploded -->
        <section class="section">
            <img src="图2.png" alt="SECTOR 01 Exploded View" class="section-img">
        </section>

        <!-- Section 4: Reservation CTA -->
        <section class="cta-box" id="reserve">
            <h2 class="cta-title">Launching Soon on Kickstarter. <span>Get 58% OFF.</span></h2>
            <p class="cta-sub">Reserve your VIP spot today to unlock the Super Early Bird price ($69 MSRP $119).</p>
            
            <!-- 替换为你自己的 Mailchimp / Formspree 提交链接 -->
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="email-form">
                <input type="email" name="email" class="email-input" placeholder="Enter your email address" required>
                <button type="submit" class="submit-btn">JOIN VIP LIST</button>
            </form>
        </section>

        <footer>
            <p>© 2026 SECTOR 01. All rights reserved. Designed for Ambient Space.</p>
        </footer>
    </div>

</body>
</html>
